<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrapa el punto</title>
    <style>
    :root {
        color-scheme:light ;
        --paper:  #f6f2e9;
        --ink:  #202b28;
        --muted:  #64716c;
        --line:  #d8d8ca;
        --coral:  #f36548;
        --teal:  #b7d9c6;
        --yellow:  #f2cb68;
    }

    *{ box-sizing: border-box; ;}

    body {
         min-height: 100vh;
         margin: 0;
         background-color: var(--paper);
         background-image: radial-gradient( #c9c7b9 0.7px, trasparent0.7px);
         background-size: 15px 15px;
         color: var(--link);
         font-family: "Trebuchet ms", sans-serif;
    }

    main {
        width: min(100% - 36px, 760px);
        margin: 0 auto;
        padding: 28px 0 42px;
    }

    .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 17px;
        border-bottom: 1px soild var(--line);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.4px;
        text-transform: uppercase;
    }
    
.brand { color: var(--link); }
.brand span { color: var(--coral); }
 
header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    padding: 37px 0 25px;
}

h1 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: clamp(42px, 9vw, 76px);
    font-weight: 700;
    line-height: o.94;
}

h1 span {color: var(--coral);}

.round-mark {
    display: grid;
    width: 58px;
    aspect-ratio: 1;
    flex: 0 0 auto;
    place-items: center;
    border: 1px solid var(--ink);
    border-radius: 50%;
    background: var(--yellow);
    font-family: georgia, serif;
    font-size: 25px;
    transform: rotate(9deg);
}

.scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-bottom: 14px;
    border: 1px solid var(--ink);
    background: var(--paper);
}

.stat {
    min-width: 0;
    padding: 13px 17px 12px;
}

.stat + .stat { border-left: 1px solid var(--line); }
.stat-label { color: var(--muted); font-size: 11px; font-weight: 800; text}








</head>
<body>
    
</body>
</html>
